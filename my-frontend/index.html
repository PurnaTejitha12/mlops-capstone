<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Flower Prediction | MLOps API</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
        margin: 0 0 8px;
        text-align: center;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus {
        border-color: #667eea;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .result {
        display: none;
        margin-top: 25px;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        background: #f0fdf4;
        border: 2px solid #22c55e;
    }

    .result h2 {
        margin: 0 0 8px;
        color: #166534;
    }

    .prediction {
        font-size: 28px;
        font-weight: bold;
        color: #15803d;
        text-transform: capitalize;
    }

    .error {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: #fef2f2;
        border: 2px solid #ef4444;
        color: #b91c1c;
        text-align: center;
    }

    .api-status {
        margin-top: 25px;
        text-align: center;
        font-size: 13px;
        color: #777;
    }

    .status-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        background: #22c55e;
        border-radius: 50%;
        margin-right: 5px;
    }

    .example {
        margin-top: 20px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 10px;
        font-size: 13px;
        color: #64748b;
        text-align: center;
    }
</style>

</head> <body>
<div class="container">

    <h1>🌸 Iris Flower Predictor</h1>

    <p class="subtitle">
        MLOps Machine Learning API
    </p>

    <form id="predictionForm">

        <div class="form-group">
            <label for="sepalLength">
                Sepal Length (cm)
            </label>
            <input
                type="number"
                id="sepalLength"
                step="0.1"
                min="0"
                placeholder="Example: 5.1"
                required
            >
        </div>

        <div class="form-group">
            <label for="sepalWidth">
                Sepal Width (cm)
            </label>
            <input
                type="number"
                id="sepalWidth"
                step="0.1"
                min="0"
                placeholder="Example: 3.5"
                required
            >
        </div>

        <div class="form-group">
            <label for="petalLength">
                Petal Length (cm)
            </label>
            <input
                type="number"
                id="petalLength"
                step="0.1"
                min="0"
                placeholder="Example: 1.4"
                required
            >
        </div>

        <div class="form-group">
            <label for="petalWidth">
                Petal Width (cm)
            </label>
            <input
                type="number"
                id="petalWidth"
                step="0.1"
                min="0"
                placeholder="Example: 0.2"
                required
            >
        </div>

        <button type="submit" id="predictButton">
            Predict Iris Species
        </button>

    </form>

    <div class="result" id="result">
        <h2>Prediction Result</h2>
        <div class="prediction" id="prediction"></div>
    </div>

    <div class="error" id="error"></div>

    <div class="example">
        💡 Example: 5.1, 3.5, 1.4, 0.2 → Setosa
    </div>

    <div class="api-status">
        <span class="status-dot"></span>
        Connected to FastAPI at localhost:8000
    </div>

</div>


<script>
    const form = document.getElementById("predictionForm");
    const button = document.getElementById("predictButton");
    const result = document.getElementById("result");
    const prediction = document.getElementById("prediction");
    const error = document.getElementById("error");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        result.style.display = "none";
        error.style.display = "none";

        const features = [
            Number(document.getElementById("sepalLength").value),
            Number(document.getElementById("sepalWidth").value),
            Number(document.getElementById("petalLength").value),
            Number(document.getElementById("petalWidth").value)
        ];

        button.disabled = true;
        button.textContent = "Predicting...";

        try {

            const response = await fetch(
                "http://localhost:8000/predict",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        features: features
                    })
                }
            );

            if (!response.ok) {
                const data = await response.json();
                throw new Error(
                    data.detail || "Prediction request failed."
                );
            }

            const data = await response.json();

            prediction.textContent = data.prediction;

            result.style.display = "block";

        } catch (err) {

            error.textContent =
                "Error: " + err.message +
                " Make sure your FastAPI server is running on port 8000.";

            error.style.display = "block";

        } finally {

            button.disabled = false;
            button.textContent = "Predict Iris Species";

        }
    });
</script>

</body> </html>
