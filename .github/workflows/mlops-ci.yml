name: W12 MLOps CI

on:
  push:
    branches:
      - main
      - "feat/aiml-W12-*"
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t w12-mlops-api:${{ github.sha }} .
